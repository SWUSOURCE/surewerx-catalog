<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14171a;
  --surface:#1d2226;
  --surface-raised:#262c31;
  --surface-hover:#2d343a;
  --border:#343c42;
  --border-light:#454f56;
  --text:#ece8de;
  --text-muted:#9aa2a8;
  --text-dim:#6b7379;
  --orange:#ff5a1f;
  --orange-dim:#c2461a;
  --yellow:#e8c700;
  --blue:#4fa3d8;
  --green:#5fb87a;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--orange);color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);
  border-bottom:2px solid var(--orange);
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  flex-wrap:wrap;
}
.brandmark{display:flex;align-items:baseline;gap:10px;flex-shrink:0;}
.brandmark .tag{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  color:var(--orange);border:1px solid var(--orange-dim);padding:3px 6px;border-radius:var(--radius);
}
.brandmark h1{
  font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em;
  margin:0;text-transform:uppercase;color:var(--text);
}
.brandmark h1 span{color:var(--orange);}

.tabbar{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2px;flex-shrink:0;overflow-x:auto;max-width:100%;}
.tabbtn{
  font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;
  background:transparent;border:none;color:var(--text-muted);padding:8px 13px;border-radius:2px;
  transition:background .12s,color .12s;white-space:nowrap;
}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{background:var(--orange);color:var(--ink);font-weight:600;}
.tabbtn .count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.75;margin-left:5px;}

.searchwrap{position:relative;flex:1 1 220px;min-width:180px;max-width:320px;}
.searchwrap input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 12px 9px 32px;border-radius:var(--radius);font-size:13px;outline:none;
  transition:border-color .12s;
}
.searchwrap input:focus{border-color:var(--orange-dim);}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-dim);}

.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
.sortselect{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:var(--radius);font-size:12px;outline:none;
}
.addfiltered-btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface);border:1px solid var(--border-light);color:var(--text-muted);
  padding:9px 12px;border-radius:var(--radius);transition:border-color .12s,color .12s;
  white-space:nowrap;
}
.addfiltered-btn:hover{border-color:var(--orange);color:var(--text);}

.carttoggle{
  position:relative;background:var(--surface);border:1px solid var(--border-light);color:var(--text);
  padding:9px 14px;border-radius:var(--radius);display:flex;align-items:center;gap:8px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;transition:border-color .12s;
}
.carttoggle:hover{border-color:var(--orange);}
.carttoggle svg{width:16px;height:16px;}
.cartbadge{
  background:var(--orange);color:var(--ink);font-weight:700;font-size:10px;
  min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;
}

.filtertoggle{display:none;background:var(--surface);border:1px solid var(--border-light);color:var(--text);
  padding:9px 12px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;}

/* ---------- Layout ---------- */
.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto;}
.sidebar{
  width:250px;flex-shrink:0;padding:20px 16px;position:sticky;top:65px;
  max-height:calc(100vh - 65px);overflow-y:auto;
}
.filter-group{margin-bottom:22px;}
.filter-group h3{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.filter-group h3 .clear-link{
  font-family:'Inter',sans-serif;color:var(--orange);cursor:pointer;text-transform:none;letter-spacing:0;font-size:11px;
}
.filter-option{
  display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:12.5px;color:var(--text-muted);
  cursor:pointer;user-select:none;border-radius:2px;
}
.filter-option:hover{color:var(--text);}
.filter-option input{accent-color:var(--orange);width:14px;height:14px;flex-shrink:0;}
.filter-option .fcount{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);}
.filter-option.active-label{color:var(--text);}
.filter-scroll{max-height:200px;overflow-y:auto;padding-right:4px;}

.main{flex:1;min-width:0;padding:20px 24px 60px;}
.resultbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.resultbar .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);}
.resultbar .count b{color:var(--orange);}
.activechips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--surface-raised);border:1px solid var(--border-light);
  padding:4px 8px;border-radius:12px;font-size:11px;color:var(--text-muted);
}
.chip button{background:none;border:none;color:var(--text-dim);font-size:13px;line-height:1;padding:0;}
.chip button:hover{color:var(--orange);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.emptystate{display:none;text-align:center;padding:70px 20px;color:var(--text-dim);}
.emptystate h3{font-family:'Oswald',sans-serif;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-size:16px;margin-bottom:6px;}

/* ---------- Card (footwear-style: thumb upper right) ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;gap:8px;padding:14px;transition:border-color .15s;
}
.card:hover{border-color:var(--border-light);}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-heading{min-width:0;}
.card-brand{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;font-weight:600;
  color:var(--orange);text-transform:uppercase;
}
.card-model{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--text);margin-top:2px;}

.card-thumb-sm{
  width:100px;height:100px;flex-shrink:0;background:#f2efe7;border-radius:2px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.card-thumb-sm img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:5px;}
.card-thumb-sm.noimg{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.05em;text-align:center;}

.card-desc{
  font-family:'Oswald',sans-serif;font-size:14.5px;font-weight:500;line-height:1.28;color:var(--text);
  text-transform:uppercase;letter-spacing:.01em;
}
.card-color{font-size:12px;color:var(--text-muted);}

.card-badges{display:flex;flex-wrap:wrap;gap:5px;}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink);background:var(--text-muted);
  padding:3px 6px 3px 9px;
  clip-path:polygon(5px 0,100% 0,100% 100%,5px 100%,0 50%);
}
.badge.on{background:var(--yellow);}
.badge.hazard{background:var(--orange);color:var(--ink);}
.badge.accessory{background:var(--blue);color:var(--ink);}

/* ---------- Hard hat color swatches ---------- */
.hh-swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;margin-top:2px;}
.hh-swatch{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--surface-raised);border:1px solid var(--border-light);border-radius:2px;
  padding:8px 6px 7px;cursor:pointer;transition:border-color .12s,background .12s;
}
.hh-swatch:hover{border-color:var(--text-dim);}
.hh-swatch.in-cart{border-color:var(--orange);background:rgba(255,90,31,.08);}
.hh-swatch-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
.hh-swatch-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);text-align:center;line-height:1.25;}
.hh-swatch-price{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);}
.hh-swatch-check{position:absolute;top:3px;right:4px;color:var(--orange);font-size:11px;font-weight:700;}
.hh-swatch.in-cart .hh-swatch-label{color:var(--text);}

.card-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-price{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--text);}
.card-price .range{font-size:11px;color:var(--text-dim);font-weight:400;margin-left:4px;}
.card-meta-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);}

.card-config{margin-top:2px;}
.config-row{display:flex;gap:8px;}
.config-field{flex:1;min-width:0;}
.config-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;}
.config-field select{
  width:100%;background:var(--surface-raised);border:1px solid var(--border-light);color:var(--text);
  padding:7px 8px;border-radius:2px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;outline:none;
}
.config-field select:focus{border-color:var(--orange);}
.static-field{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);
  background:var(--surface-raised);border:1px solid var(--border);padding:7px 8px;border-radius:2px;
}

.add-all-btn{
  width:100%;background:none;border:1px solid var(--border-light);color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;font-weight:600;text-transform:uppercase;
  padding:9px 10px;border-radius:2px;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:2px;
}
.add-all-btn:hover{border-color:var(--orange);color:var(--orange);}
.add-all-btn.all-added{background:var(--orange);border-color:var(--orange);color:var(--ink);}
.add-all-btn.all-added:hover{background:var(--orange-dim);border-color:var(--orange-dim);color:var(--ink);}

/* ---------- Cart drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.open{opacity:1;pointer-events:auto;}
.cartdrawer{
  position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--border-light);z-index:61;transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;
}
.cartdrawer.open{transform:translateX(0);}
.cartdrawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.cartdrawer-head h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;margin:0;letter-spacing:.03em;}
.cartdrawer-head button{background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1;}
.cartdrawer-head button:hover{color:var(--orange);}
.cartlist{flex:1;overflow-y:auto;padding:10px 18px;}
.cartgroup{padding:10px 0;border-bottom:1px solid var(--border);}
.cartgroup-head{display:flex;gap:10px;align-items:flex-start;}
.cartgroup img{width:44px;height:44px;object-fit:contain;background:#f2efe7;border-radius:2px;flex-shrink:0;}
.cartgroup-info{flex:1;min-width:0;}
.cartgroup-name{font-size:12px;color:var(--text);font-weight:500;line-height:1.3;}
.cartgroup-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);margin-top:2px;}
.cartgroup-remove{background:none;border:none;color:var(--text-dim);font-size:16px;padding:0 2px;align-self:flex-start;}
.cartgroup-remove:hover{color:var(--orange);}
.cartempty{text-align:center;padding:50px 20px;color:var(--text-dim);font-size:13px;}
.cartdrawer-foot{padding:16px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.cartsummary{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-muted);}
.cartsummary b{color:var(--text);font-size:15px;}
.exportbtn{
  background:var(--orange);border:none;color:var(--ink);font-weight:700;font-family:'Oswald',sans-serif;
  letter-spacing:.03em;text-transform:uppercase;font-size:13px;padding:11px;border-radius:2px;
}
.exportbtn:hover{background:#ff7038;}
.clearcartbtn{background:transparent;border:1px solid var(--border-light);color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px;border-radius:2px;}
.clearcartbtn:hover{border-color:var(--orange);color:var(--orange);}

/* ---------- Responsive ---------- */
@media (max-width:880px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--ink);z-index:62;
    transform:translateX(-100%);transition:transform .22s ease;padding-top:70px;box-shadow:2px 0 14px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .filtertoggle{display:inline-flex;align-items:center;gap:6px;}
  .sortselect{display:none;}
  .addfiltered-btn{order:5;}
  .topbar{padding:12px 14px;gap:10px;}
  .brandmark h1{font-size:16px;}
  .main{padding:14px 14px 50px;}
  .tabbar{order:4;width:100%;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .card-desc{font-size:12.5px;}
  .card-thumb-sm{width:80px;height:80px;}
  .config-row{flex-direction:column;}
}

@media (max-width:600px){
  .grid{grid-template-columns:1fr;}
  .card-thumb-sm{width:120px;height:120px;}
}


</style>
</head>
<body>

<div class="topbar">
  <div class="brandmark">
    <span class="tag">SUREWERX</span>
    <h1>Field <span>Catalog</span></h1>
  </div>

  <button class="filtertoggle" id="filterToggle">☰ Filters</button>

  <div class="tabbar" id="tabbar"></div>

  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search model, brand, description…">
  </div>

  <div class="topbar-right">
    <select class="sortselect" id="sortSelect">
      <option value="name-asc">Name: A–Z</option>
      <option value="name-desc">Name: Z–A</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
    </select>
    <button class="addfiltered-btn" id="addFilteredBtn">+ Add all filtered</button>
    <button class="carttoggle" id="cartToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Cart
      <span class="cartbadge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div id="sidebarFilters"></div>
  </div>

  <div class="main">
    <div class="resultbar">
      <div class="count" id="resultCount"></div>
      <div class="activechips" id="activeChips"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="emptystate" id="emptyState">
      <h3>No matches</h3>
      <div>Try clearing a filter or adjusting your search.</div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="cartdrawer" id="cartDrawer">
  <div class="cartdrawer-head">
    <h2>Your Selection</h2>
    <button id="cartClose">×</button>
  </div>
  <div class="cartlist" id="cartList"></div>
  <div class="cartdrawer-foot">
    <div class="cartsummary"><span id="cartLineCount">0</span> SKU(s) &nbsp; <b id="cartTotal">$0.00</b></div>
    <button class="exportbtn" id="exportBtn">Export CSV</button>
    <button class="clearcartbtn" id="clearCartBtn">Clear selection</button>
  </div>
</div>

<script>
/* global FOOTWEAR_PRODUCTS, INSOLE_PRODUCTS, WINTER_PRODUCTS, APPAREL_PRODUCTS, KNEEPAD_PRODUCTS, HARDHAT_PRODUCTS */

const norm = v => (v === undefined || v === null || v === '') ? null : (typeof v === 'string' ? v.trim() : v);

/* ============================================================
   CATEGORY CONFIG
   Each category defines: data, hasWidths (footwear only), filters,
   features (badge/checklist booleans), addLabel, csvHeaders/csvRow
   ============================================================ */

const CATEGORIES = {
  footwear: {
    label: 'Footwear', data: FOOTWEAR_PRODUCTS, hasWidths: true, addLabel: 'Add style to cart', addedLabel: 'Style in cart',
    filters: [
      { id: 'brand', title: 'Brand', field: 'brand' },
      { id: 'gender', title: 'Gender', field: 'gender', fallback: 'Unspecified' },
      { id: 'toe', title: 'Toe Type', field: 'toe', fallback: 'Not specified' },
      { id: 'ehsd', title: 'EH / SD Rating', field: 'ehsd', fallback: 'None' },
      { id: 'baseColor', title: 'Base Color', field: 'baseColor', fallback: 'Not specified' },
      { id: 'upper', title: 'Upper Material', field: 'upper', fallback: 'Not specified' },
      { id: 'silhouette', title: 'Silhouette', field: 'silhouette', fallback: 'Not specified' },
    ],
    features: [
      { id: 'waterproof', label: 'Waterproof', test: p => p.waterproof },
      { id: 'insulated', label: 'Insulated', test: p => p.insulated },
      { id: 'puncture', label: 'Puncture Resistant', test: p => p.puncture },
      { id: 'metGuard', label: 'Met Guard', test: p => norm(p.metGuard) === 'INTERNAL' },
      { id: 'heatResist', label: 'Heat Resistant', test: p => p.heatResist },
      { id: 'slipResist', label: 'Slip Resistant', test: p => p.slipResist },
      { id: 'secFriendly', label: 'Security Friendly', test: p => p.secFriendly },
      { id: 'noMetal', label: 'No Exposed Metal', test: p => p.noMetal },
      { id: 'bigWide', label: 'Big & Wide Available', test: p => norm(p.bigWide) === 'YES' },
      { id: 'definedHeel', label: 'Defined Heel', test: p => norm(p.definedHeel) === 'YES' },
    ],
    badgesOf: p => {
      const b = [];
      const toe = norm(p.toe);
      if (toe) b.push({ txt: toe.length > 9 ? toe.slice(0, 3).toUpperCase() : toe.toUpperCase(), on: false });
      const ehsd = norm(p.ehsd);
      if (ehsd) b.push({ txt: ehsd, hazard: true });
      if (p.waterproof) b.push({ txt: 'WP', on: true });
      if (p.insulated) b.push({ txt: 'INSUL', on: true });
      if (norm(p.metGuard) === 'INTERNAL') b.push({ txt: 'MET GRD', on: true });
      if (p.heatResist) b.push({ txt: 'HEAT', on: true });
      if (p.slipResist) b.push({ txt: 'SLIP RES', on: false });
      if (p.puncture) b.push({ txt: 'PUNCT RES', on: false });

const CAT_ORDER = ['footwear', 'insole', 'winter', 'apparel', 'kneepads', 'hardhats'];

const state = {
  cat: 'footwear',
  search: '',
  sort: 'name-asc',
  filters: {},   // cat -> { groupId: Set }
  features: {},  // cat -> Set
};
CAT_ORDER.forEach(c => {
  state.filters[c] = {};
  CATEGORIES[c].filters.forEach(f => state.filters[c][f.id] = new Set());
  state.features[c] = new Set();
});

const selection = new Map();   // key(cat+master) -> { width, size }
const cart = new Map();        // key(cat+sku) -> cart line item

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function fmtPrice(n) { return n == null ? '—' : '$' + Number(n).toFixed(2); }

function activeCategory() { return CATEGORIES[state.cat]; }

/* ---------- Widths / sizes helpers ---------- */
function allSizesOf(p, cfg) {
  if (cfg.hasWidths) return p.widths.flatMap(w => w.sizes);
  if (cfg.hasSwatches && p.kind === 'series') return p.colors;
  return p.sizes;
}
function selKey(p) { return state.cat + '::' + p.master; }
function getSelection(p, cfg) {
  const key = selKey(p);
  let sel = selection.get(key);
  if (cfg.hasWidths) {
    if (!sel || !p.widths.find(w => w.code === sel.width)) {
      const w0 = p.widths[0];
      sel = { width: w0.code, size: w0.sizes[0] ? w0.sizes[0].sku : null };
      selection.set(key, sel);
    }
  } else {
    if (!sel) {
      sel = { size: p.sizes[0] ? p.sizes[0].sku : null };
      selection.set(key, sel);
    }
  }
  return sel;
}

/* ---------- Matching / sorting ---------- */
function matches(p) {
  const cfg = activeCategory();
  const q = state.search.trim().toLowerCase();
  if (q) {
    const hay = (p.master + ' ' + (p.brand || '') + ' ' + (p.desc || '')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const filters = state.filters[state.cat];
  for (const f of cfg.filters) {
    const set = filters[f.id];
    if (set.size && !set.has(String(norm(p[f.field]) ?? (f.fallback || '')))) return false;
  }
  const featSet = state.features[state.cat];
  if (featSet.size) {
    for (const featId of featSet) {
      const feat = cfg.features.find(x => x.id === featId);
      if (feat && !feat.test(p)) return false;
    }
  }
  return true;
}
function priceOf(p) { return p.priceMin != null ? p.priceMin : p.price; }
function sortList(list) {
  const [field, dir] = state.sort.split('-');
  const mul = dir === 'desc' ? -1 : 1;
  return list.slice().sort((a, b) => {
    if (field === 'price') return mul * ((priceOf(a) || 0) - (priceOf(b) || 0));
    return mul * (a.desc || a.master).localeCompare(b.desc || b.master);
  });
}

/* ---------- Cart ---------- */
function cartKey(sku) { return state.cat + '::' + sku; }
function toggleAllSizes(p) {
  const cfg = activeCategory();
  const sizes = allSizesOf(p, cfg);
  const allIn = sizes.length > 0 && sizes.every(s => cart.has(cartKey(s.sku)));
  sizes.forEach(s => {
    const key = cartKey(s.sku);
    if (allIn) {
      cart.delete(key);
    } else if (!cart.has(key)) {
      cart.set(key, {
        cat: state.cat, sku: s.sku, size: s.size, color: s.color, price: s.price, upc: s.upc,
        width: s.width, master: p.master, brand: p.brand, desc: p.desc, image: p.image || s.image,
        isAccessory: p.isAccessory, compatibility: p.compatibility,
      });
    }
  });
}
function toggleSwatch(p, sku) {
  const key = cartKey(sku);
  if (cart.has(key)) {
    cart.delete(key);
    return;
  }
  const c = p.colors.find(x => x.sku === sku);
  if (!c) return;
  cart.set(key, {
    cat: state.cat, sku: c.sku, size: c.color, color: c.color, price: c.price, upc: c.upc,
    master: p.master, brand: p.brand, desc: p.desc, image: p.image || c.image,
  });
}
function addAllFiltered() {
  const cfg = activeCategory();
  const list = sortList(cfg.data.filter(matches));
  list.forEach(p => {
    allSizesOf(p, cfg).forEach(s => {
      const key = cartKey(s.sku);
      if (!cart.has(key)) {
        cart.set(key, {
          cat: state.cat, sku: s.sku, size: s.size, color: s.color, price: s.price, upc: s.upc,
          width: s.width, master: p.master, brand: p.brand, desc: p.desc, image: p.image || s.image,
          isAccessory: p.isAccessory, compatibility: p.compatibility,
        });
      }
    });
  });
  renderGrid(); renderCart(); updateCartCount();
}

/* ---------- Hard hat swatch color mapping ---------- */
function swatchColor(name) {
  const n = (name || '').toLowerCase();
  const table = [
    ['hi-vis orange', '#ff6a00'], ['hi-vis', '#e8e300'], ['orange', '#ff7a00'],
    ['yellow', '#f4c430'], ['white', '#f4f2ea'], ['navy', '#1b2a4a'], ['blue', '#2c6fbb'],
    ['red', '#c0392b'], ['green', '#2f8f46'], ['black', '#232323'], ['grey', '#8a8f94'], ['gray', '#8a8f94'],
    ['silver', '#c3c6c9'], ['tan', '#c9a876'], ['copper', '#b3702a'], ['brown', '#6b4a2f'],
  ];
  for (const [key, hex] of table) if (n.includes(key)) return hex;
  return '#7a828a';
}

/* ---------- Card template ---------- */
function cardTemplate(p) {
  const cfg = activeCategory();
  if (cfg.hasSwatches && p.kind === 'series') return hardHatSeriesCard(p);
  const sel = getSelection(p, cfg);
  const totalSizes = allSizesOf(p, cfg).length;
  const inCartCount = allSizesOf(p, cfg).filter(s => cart.has(cartKey(s.sku))).length;
  const allInCart = totalSizes > 0 && inCartCount === totalSizes;

  const thumb = p.image
    ? `<div class="card-thumb-sm"><img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.desc || p.master)}" loading="lazy" onerror="this.parentElement.classList.add('noimg');this.remove();"></div>`
    : `<div class="card-thumb-sm noimg">No image</div>`;

  const badges = cfg.badgesOf(p).map(b =>
    `<span class="badge${b.on ? ' on' : ''}${b.hazard ? ' hazard' : ''}${b.accessory ? ' accessory' : ''}">${escapeHtml(b.txt)}</span>`).join('');

  let configHtml = '';
  if (cfg.hasWidths) {
    const widthField = p.widths.length > 1
      ? `<select class="width-select" data-master="${escapeHtml(p.master)}">
           ${p.widths.map(w => `<option value="${escapeHtml(w.code)}" ${w.code === sel.width ? 'selected' : ''}>${escapeHtml(w.code)} (${w.sizes.length})</option>`).join('')}
         </select>`
      : `<div class="static-field">${escapeHtml(p.widths[0].code)}</div>`;
    const activeWidth = p.widths.find(w => w.code === sel.width) || p.widths[0];
    const sortedSizes = [...activeWidth.sizes].sort((a, b) => (parseFloat(a.size) || 0) - (parseFloat(b.size) || 0));
    const sizeField = sortedSizes.length > 1
      ? `<select class="size-select" data-master="${escapeHtml(p.master)}">
           ${sortedSizes.map(s => `<option value="${escapeHtml(s.sku)}" ${s.sku === sel.size ? 'selected' : ''}>${escapeHtml(s.size)}</option>`).join('')}
         </select>`
      : `<div class="static-field">${sortedSizes.length ? escapeHtml(sortedSizes[0].size) : '—'}</div>`;
    configHtml = `<div class="card-config"><div class="config-row">
        <div class="config-field"><label>Width</label>${widthField}</div>
        <div class="config-field"><label>Size</label>${sizeField}</div>
      </div></div>`;
  } else if (p.sizes && p.sizes.length > 1) {
    const sortedSizes = [...p.sizes].sort((a, b) => (parseFloat(a.size) || 0) - (parseFloat(b.size) || 0) || String(a.size).localeCompare(String(b.size)));
    const sizeField = `<select class="size-select" data-master="${escapeHtml(p.master)}">
        ${sortedSizes.map(s => `<option value="${escapeHtml(s.sku)}" ${s.sku === sel.size ? 'selected' : ''}>${escapeHtml(s.size)}</option>`).join('')}
      </select>`;
    configHtml = `<div class="card-config"><div class="config-row">
        <div class="config-field"><label>Size</label>${sizeField}</div>
      </div></div>`;
  }

  const priceLabel = p.priceMin != null
    ? (p.priceMin === p.priceMax ? fmtPrice(p.priceMin) : `${fmtPrice(p.priceMin)}<span class="range">– ${fmtPrice(p.priceMax)}</span>`)
    : fmtPrice(p.price);

  const metaBits = [];
  if (cfg.hasWidths) metaBits.push(`${p.widths.length} width${p.widths.length === 1 ? '' : 's'} · ${totalSizes} sizes`);
  else if (totalSizes > 1) metaBits.push(`${totalSizes} sizes`);
  if (inCartCount) metaBits.push(`${inCartCount} in cart`);

  const meta = cfg.metaOf(p);

  return `<div class="card" data-master="${escapeHtml(p.master)}">
    <div class="card-top">
      <div class="card-heading">
        <div class="card-brand">${escapeHtml(p.brand || '')}</div>
        <div class="card-model">${escapeHtml(p.master)}</div>
      </div>
      ${thumb}
    </div>
    <div class="card-desc">${escapeHtml(p.desc || 'Unnamed model')}</div>
    ${meta ? `<div class="card-color">${escapeHtml(meta)}</div>` : ''}
    ${badges ? `<div class="card-badges">${badges}</div>` : ''}
    <div class="card-foot">
      <div class="card-price">${priceLabel}</div>
      ${metaBits.length ? `<div class="card-meta-note">${metaBits.join(' · ')}</div>` : ''}
    </div>
    ${configHtml}
    <button class="add-all-btn${allInCart ? ' all-added' : ''}" data-master="${escapeHtml(p.master)}">${allInCart ? '✓ ' + cfg.addedLabel : cfg.addLabel}</button>
  </div>`;
}

function hardHatSeriesCard(p) {
  const cfg = activeCategory();
  const totalColors = p.colors.length;
  const inCartCount = p.colors.filter(c => cart.has(cartKey(c.sku))).length;
  const allInCart = totalColors > 0 && inCartCount === totalColors;

  const thumb = p.image
    ? `<div class="card-thumb-sm"><img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.desc || p.master)}" loading="lazy" onerror="this.parentElement.classList.add('noimg');this.remove();"></div>`
    : `<div class="card-thumb-sm noimg">No image</div>`;

  const badges = cfg.badgesOf(p).map(b =>
    `<span class="badge${b.on ? ' on' : ''}${b.hazard ? ' hazard' : ''}${b.accessory ? ' accessory' : ''}">${escapeHtml(b.txt)}</span>`).join('');

  const priceLabel = p.priceMin != null
    ? (p.priceMin === p.priceMax ? fmtPrice(p.priceMin) : `${fmtPrice(p.priceMin)}<span class="range">– ${fmtPrice(p.priceMax)}</span>`)
    : '—';

  const meta = cfg.metaOf(p);
  const metaBits = [`${totalColors} color${totalColors === 1 ? '' : 's'}`];
  if (inCartCount) metaBits.push(`${inCartCount} in cart`);

  const swatches = p.colors.map(c => {
    const inCart = cart.has(cartKey(c.sku));
    return `<button type="button" class="hh-swatch${inCart ? ' in-cart' : ''}" data-sku="${escapeHtml(c.sku)}" data-master="${escapeHtml(p.master)}" title="${escapeHtml(c.color || '')} — ${fmtPrice(c.price)}">
      <span class="hh-swatch-dot" style="background:${swatchColor(c.color)}"></span>
      <span class="hh-swatch-label">${escapeHtml(c.color || c.sku)}</span>
      <span class="hh-swatch-price">${fmtPrice(c.price)}</span>
      ${inCart ? '<span class="hh-swatch-check">✓</span>' : ''}
    </button>`;
  }).join('');

  return `<div class="card hh-card" data-master="${escapeHtml(p.master)}">
    <div class="card-top">
      <div class="card-heading">
        <div class="card-brand">${escapeHtml(p.brand || '')}</div>
        <div class="card-model">${escapeHtml(p.series)}</div>
      </div>
      ${thumb}
    </div>
    <div class="card-desc">${escapeHtml(p.desc || 'Unnamed series')}</div>
    ${meta ? `<div class="card-color">${escapeHtml(meta)}</div>` : ''}
    ${badges ? `<div class="card-badges">${badges}</div>` : ''}
    <div class="card-foot">
      <div class="card-price">${priceLabel}</div>
      <div class="card-meta-note">${metaBits.join(' · ')}</div>
    </div>
    <div class="hh-swatch-grid">${swatches}</div>
    <button class="add-all-btn hh-addall-btn${allInCart ? ' all-added' : ''}" data-master="${escapeHtml(p.master)}">${allInCart ? `✓ All ${totalColors} colors in cart` : `Add all ${totalColors} colors`}</button>
  </div>`;
}

/* ---------- Sidebar filters ---------- */
function optionsFor(cfg, list, filterDef) {
  const counts = new Map();
  list.forEach(p => {
    const raw = norm(p[filterDef.field]);
    const val = String(raw ?? (filterDef.fallback || ''));
    if (!val) return;
    counts.set(val, (counts.get(val) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function renderFilters() {
  const cfg = activeCategory();
  const el = document.getElementById('sidebarFilters');
  const list = cfg.data;
  const filters = state.filters[state.cat];
  const featSet = state.features[state.cat];

  let html = '';
  cfg.filters.forEach(f => {
    const opts = optionsFor(cfg, list, f);
    if (!opts.length) return;
    const active = filters[f.id];
    html += `<div class="filter-group">
      <h3>${escapeHtml(f.title)} ${active.size ? `<span class="clear-link" data-clear-filter="${f.id}">clear</span>` : ''}</h3>
      <div class="filter-scroll">
      ${opts.map(([val, count]) => `
        <label class="filter-option ${active.has(val) ? 'active-label' : ''}">
          <input type="checkbox" data-filter="${f.id}" value="${escapeHtml(val)}" ${active.has(val) ? 'checked' : ''}>
          ${escapeHtml(f.labelMap ? (f.labelMap[val] || val) : val)}
          <span class="fcount">${count}</span>
        </label>`).join('')}
      </div>
    </div>`;
  });
  if (cfg.features.length) {
    html += `<div class="filter-group">
      <h3>Features ${featSet.size ? `<span class="clear-link" data-clear-features="1">clear</span>` : ''}</h3>
      ${cfg.features.map(feat => `
        <label class="filter-option ${featSet.has(feat.id) ? 'active-label' : ''}">
          <input type="checkbox" data-feature="${feat.id}" ${featSet.has(feat.id) ? 'checked' : ''}>
          ${escapeHtml(feat.label)}
          <span class="fcount">${list.filter(feat.test).length}</span>
        </label>`).join('')}
    </div>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('input[data-filter]').forEach(cb => {
    cb.addEventListener('change', () => {
      const set = filters[cb.dataset.filter];
      if (cb.checked) set.add(cb.value); else set.delete(cb.value);
      renderAll();
    });
  });
  el.querySelectorAll('input[data-feature]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) featSet.add(cb.dataset.feature); else featSet.delete(cb.dataset.feature);
      renderAll();
    });
  });
  el.querySelectorAll('[data-clear-filter]').forEach(link => {
    link.addEventListener('click', () => { filters[link.dataset.clearFilter].clear(); renderAll(); });
  });
  el.querySelectorAll('[data-clear-features]').forEach(link => {
    link.addEventListener('click', () => { featSet.clear(); renderAll(); });
  });
}

/* ---------- Active chips ---------- */
function renderChips() {
  const cfg = activeCategory();
  const el = document.getElementById('activeChips');
  const filters = state.filters[state.cat];
  const featSet = state.features[state.cat];
  const chips = [];
  cfg.filters.forEach(f => {
    filters[f.id].forEach(val => chips.push({ type: 'filter', id: f.id, val, label: f.labelMap ? (f.labelMap[val] || val) : val }));
  });
  featSet.forEach(fid => {
    const feat = cfg.features.find(x => x.id === fid);
    if (feat) chips.push({ type: 'feature', id: fid, label: feat.label });
  });
  if (!chips.length) { el.innerHTML = ''; return; }
  el.innerHTML = chips.map((c, i) =>
    `<span class="chip">${escapeHtml(c.label)}<button data-idx="${i}">×</button></span>`).join('');
  el.querySelectorAll('button').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      const c = chips[i];
      if (c.type === 'filter') filters[c.id].delete(c.val); else featSet.delete(c.id);
      renderAll();
    });
  });
}

/* ---------- Grid ---------- */
function renderGrid() {
  const cfg = activeCategory();
  const gridEl = document.getElementById('grid');
  const emptyEl = document.getElementById('emptyState');
  const countEl = document.getElementById('resultCount');
  const filtered = sortList(cfg.data.filter(matches));
  countEl.innerHTML = `<b>${filtered.length}</b> model${filtered.length === 1 ? '' : 's'}`;
  gridEl.style.display = filtered.length ? 'grid' : 'none';
  emptyEl.style.display = filtered.length ? 'none' : 'block';
  gridEl.innerHTML = filtered.map(cardTemplate).join('');

  gridEl.querySelectorAll('.width-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const p = cfg.data.find(pr => pr.master === sel.dataset.master);
      const w = p.widths.find(w => w.code === e.target.value);
      selection.set(selKey(p), { width: w.code, size: w.sizes[0] ? w.sizes[0].sku : null });
      renderGrid();
    });
  });
  gridEl.querySelectorAll('.size-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const p = cfg.data.find(pr => pr.master === sel.dataset.master);
      const cur = getSelection(p, cfg);
      selection.set(selKey(p), Object.assign({}, cur, { size: e.target.value }));
      renderGrid();
    });
  });
  gridEl.querySelectorAll('.add-all-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = cfg.data.find(pr => pr.master === btn.dataset.master);
      toggleAllSizes(p);
      renderGrid(); renderCart(); updateCartCount();
    });
  });
  gridEl.querySelectorAll('.hh-swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = cfg.data.find(pr => pr.master === btn.dataset.master);
      toggleSwatch(p, btn.dataset.sku);
      renderGrid(); renderCart(); updateCartCount();
    });
  });
}

/* ---------- Cart drawer ---------- */
function renderCart() {
  const listEl = document.getElementById('cartList');
  const items = [...cart.values()];
  if (!items.length) {
    listEl.innerHTML = `<div class="cartempty">Your cart is empty.<br>Add products from the catalog to build a pick list.</div>`;
  } else {
    // group by cat+master for a cleaner drawer
    const groups = new Map();
    items.forEach(it => {
      const gk = it.cat + '::' + it.master;
      if (!groups.has(gk)) groups.set(gk, { cat: it.cat, master: it.master, brand: it.brand, desc: it.desc, image: it.image, lines: [] });
      groups.get(gk).lines.push(it);
    });
    listEl.innerHTML = [...groups.values()].map(g => `
      <div class="cartgroup" data-cat="${escapeHtml(g.cat)}" data-master="${escapeHtml(g.master)}">
        <div class="cartgroup-head">
          <img src="${escapeHtml(g.image || '')}" onerror="this.style.visibility='hidden'">
          <div class="cartgroup-info">
            <div class="cartgroup-name">${escapeHtml(g.desc || g.master)}</div>
            <div class="cartgroup-meta">${escapeHtml(CATEGORIES[g.cat].label)} · ${g.lines.length} SKU${g.lines.length === 1 ? '' : 's'} · ${fmtPrice(g.lines.reduce((s, l) => s + (Number(l.price) || 0), 0))}</div>
          </div>
          <button class="cartgroup-remove" data-cat="${escapeHtml(g.cat)}" data-master="${escapeHtml(g.master)}">×</button>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.cartgroup-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat, master = btn.dataset.master;
        [...cart.keys()].forEach(k => { if (cart.get(k).cat === cat && cart.get(k).master === master) cart.delete(k); });
        renderCart(); renderGrid(); updateCartCount();
      });
    });
  }
  const total = items.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
  document.getElementById('cartTotal').textContent = fmtPrice(total);
  document.getElementById('cartLineCount').textContent = items.length;
}
function updateCartCount() {
  document.getElementById('cartBadge').textContent = cart.size;
  document.getElementById('cartBadge').style.display = cart.size ? 'flex' : 'none';
}

function exportCsv() {
  const items = [...cart.values()];
  if (!items.length) return;
  const byCat = new Map();
  items.forEach(it => { if (!byCat.has(it.cat)) byCat.set(it.cat, []); byCat.get(it.cat).push(it); });
  const blocks = [];
  byCat.forEach((its, cat) => {
    const cfg = CATEGORIES[cat];
    blocks.push([cfg.label]);
    blocks.push(cfg.csvHeaders);
    its.forEach(it => blocks.push(cfg.csvRow(it)));
    blocks.push([]);
  });
  const csv = blocks.map(r => r.map(v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'field_catalog_selection.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Tabs / search / sort ---------- */
function setCategory(cat) {
  state.cat = cat;
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  renderAll();
}
function renderAll() {
  renderFilters();
  renderChips();
  renderGrid();
  renderCart();
  updateCartCount();
}

function renderTabBar() {
  const tabbar = document.getElementById('tabbar');
  tabbar.innerHTML = CAT_ORDER.map(c =>
    `<button class="tabbtn${c === state.cat ? ' active' : ''}" data-cat="${c}">${CATEGORIES[c].label} <span class="count">${CATEGORIES[c].data.length}</span></button>`
  ).join('');
  tabbar.querySelectorAll('.tabbtn').forEach(btn => btn.addEventListener('click', () => setCategory(btn.dataset.cat)));
}

/**
 * Loads the Footwear catalog from the public data file (synced from the
 * admin repo) instead of a hardcoded array. FOOTWEAR_PRODUCTS is mutated
 * in place -- not reassigned -- since CATEGORIES.footwear.data already
 * holds a reference to this exact array object.
 */
async function loadFootwearData() {
  try {
    const res = await fetch('/data/footwear.json');
    const data = await res.json();
    FOOTWEAR_PRODUCTS.push(...data);
  } catch (err) {
    console.error('Failed to load footwear catalog:', err);
  }
  renderTabBar();
  renderAll();
}

document.addEventListener('DOMContentLoaded', () => {
  renderTabBar();

  document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; renderGrid(); });
  document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });
  document.getElementById('addFilteredBtn').addEventListener('click', addAllFiltered);

  document.getElementById('cartToggle').addEventListener('click', () => {
    document.getElementById('cartDrawer').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  });
  function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
  function closeFilters() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
  document.getElementById('cartClose').addEventListener('click', closeCart);
  document.getElementById('scrim').addEventListener('click', () => { closeCart(); closeFilters(); });
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('clearCartBtn').addEventListener('click', () => { cart.clear(); renderCart(); renderGrid(); updateCartCount(); });
  document.getElementById('filterToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  });

  renderAll();
  loadFootwearData();
});


</script>
